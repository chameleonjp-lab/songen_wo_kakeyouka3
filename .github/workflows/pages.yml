name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    env:
      VITE_MATCH_SERVER_URL: ${{ vars.VITE_MATCH_SERVER_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)" || [ "$build_type" != workflow ]; then
            echo "::error::Set the Pages build and deployment source to GitHub Actions in repository settings."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source and static output
        run: |
          pnpm check
          pnpm test

      - name: Install WebKit
        run: pnpm exec playwright install --with-deps webkit

      - name: Run two-player WebKit tests
        run: pnpm test:browser

      - name: Build static site for production
        run: pnpm build

      - name: Verify production match server and rankings
        run: |
          node --input-type=module <<'NODE'
          import { VERSION } from './game/protocol.js';

          let url;
          try {
            url = new URL(process.env.VITE_MATCH_SERVER_URL);
          } catch {
            throw new Error('Set the repository Actions variable VITE_MATCH_SERVER_URL to the production Worker origin.');
          }
          if (url.protocol !== 'https:' || url.username || url.password || url.pathname !== '/' || url.search || url.hash) {
            throw new Error('VITE_MATCH_SERVER_URL must be an HTTPS origin.');
          }

          const response = await fetch(new URL('/v1/health', url), {
            redirect: 'error',
            signal: AbortSignal.timeout(15_000),
          });
          if (!response.ok) throw new Error(`Health check returned HTTP ${response.status}.`);
          const { version, acceptingRooms, rankingReady } = await response.json();
          if (version !== VERSION) throw new Error(`The Worker must report protocol version ${VERSION}.`);
          if (acceptingRooms !== true) throw new Error('The Worker is not accepting new rooms.');
          if (rankingReady !== true) throw new Error('The ranking service is not ready.');

          const publicOrigin = 'https://chameleonjp-lab.github.io';
          const preflight = await fetch(new URL('/v1/rooms', url), {
            method: 'OPTIONS',
            headers: {
              Origin: publicOrigin,
              'Access-Control-Request-Method': 'POST',
              'Access-Control-Request-Headers': 'Content-Type',
            },
            redirect: 'error',
            signal: AbortSignal.timeout(15_000),
          });
          if (!preflight.ok || preflight.headers.get('access-control-allow-origin') !== publicOrigin) {
            throw new Error('The Worker must allow room requests from the GitHub Pages origin.');
          }
          console.log(`The production Worker accepts rooms using protocol ${VERSION} and rankings are ready.`);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

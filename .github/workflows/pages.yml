name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    env:
      VITE_MATCH_SERVER_URL: ${{ vars.VITE_MATCH_SERVER_URL || 'https://songen3-online.chameleonjp-lab.workers.dev' }}
      RANKING_PUBLIC_OVERRIDE: ${{ vars.VITE_RANKINGS_PUBLIC }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)" || [ "$build_type" != workflow ]; then
            echo "::error::Set the Pages build and deployment source to GitHub Actions in repository settings."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source and static output
        run: |
          pnpm check
          pnpm test

      - name: Install WebKit
        run: pnpm exec playwright install --with-deps webkit

      - name: Run two-player WebKit tests
        run: pnpm test:browser

      - name: Verify the production match server before publishing
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { verifyPagesReadiness } from './scripts/pages-readiness.js';

          const override = process.env.RANKING_PUBLIC_OVERRIDE;
          if (override && !['true', 'false'].includes(override)) {
            throw new Error('VITE_RANKINGS_PUBLIC must be true, false, or unset.');
          }
          const publishRankings = await verifyPagesReadiness(process.env.VITE_MATCH_SERVER_URL,
            override ? override === 'true' : undefined);
          appendFileSync(process.env.GITHUB_ENV, `VITE_RANKINGS_PUBLIC=${publishRankings}\n`);
          console.log(publishRankings ? 'Match server and rankings are ready.' : 'Match server is ready. Rankings are on hold.');
          NODE

      - name: Build static site for production
        run: pnpm build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

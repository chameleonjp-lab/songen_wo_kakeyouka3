name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"

          if [ "$status" = "404" ]; then
            echo "::error title=GitHub Pages workflow source could not be confirmed::The Pages API returned 404. Set Repository Settings → Pages → Build and deployment → Source to GitHub Actions, then rerun this workflow. A visible legacy Jekyll page is not the game deployment. (API status ${status})"
            cat "$response_file"
            exit 1
          fi

          if [ "$status" != "200" ]; then
            echo "::error title=GitHub Pages configuration could not be read::The Pages API returned HTTP ${status}; check repository permissions and Pages settings before rerunning."
            cat "$response_file"
            exit 1
          fi

          build_type="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("build_type", ""))' "$response_file")"
          if [ "$build_type" != "workflow" ]; then
            echo "::error title=GitHub Pages source is not GitHub Actions::Set Pages → Build and deployment → Source to GitHub Actions, then rerun this workflow. (build_type=${build_type:-unknown})"
            cat "$response_file"
            exit 1
          fi

          echo "GitHub Pages is enabled with GitHub Actions as the source."

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source and assets
        run: |
          pnpm check
          pnpm test
          python3 tools/sync_character_assets.py --check
          python3 tools/audit_character_glbs.py --check

      - name: Build static site
        run: pnpm build

      - name: Verify static output paths and runtime assets
        run: pnpm check:static

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static Vite output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name = "songen3-online"
main = "worker/index.js"
compatibility_date = "2026-11-26"
workers_dev = true

[vars]
ACCEPT_NEW_ROOMS = "false"
RANKINGS_PUBLIC = "false"
ALLOWED_ORIGINS = "https://chameleonjp-lab.github.io"
RANKING_SUPABASE_URL = "https://mlpnjgezrnhdxsxolyzj.supabase.co"

[[durable_objects.bindings]]
name = "MATCH_ROOMS"
class_name = "MatchRoom"

[[durable_objects.bindings]]
name = "ENTRY_LIMIT"
class_name = "EntryLimit"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom", "EntryLimit"]

[env.preview]
name = "songen3-online-preview"

[env.preview.vars]
ACCEPT_NEW_ROOMS = "true"
RANKINGS_PUBLIC = "false"
ALLOWED_ORIGINS = "http://127.0.0.1:5173,http://localhost:5173,https://chameleonjp-lab.github.io"
RANKING_SUPABASE_URL = ""

[[env.preview.durable_objects.bindings]]
name = "MATCH_ROOMS"
class_name = "MatchRoom"

[[env.preview.durable_objects.bindings]]
name = "ENTRY_LIMIT"
class_name = "EntryLimit"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom", "EntryLimit"]
